name: "Testing OpenRuntimes"

on: [ pull_request ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@2d756ea4c53f7f6b397767d8723b3a10a9f35bf2 # v44
        with:
          files: |
            ./**
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Check docker-bake.json is up to date
        run: bun ./ci/bake.ts --check
      - name: Prepare
        id: prepare
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: bun ./ci/index.ts

  shell-format-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install shfmt
        run: |
          wget -O shfmt https://github.com/mvdan/sh/releases/download/v3.8.0/shfmt_v3.8.0_linux_amd64
          chmod +x shfmt
          sudo mv shfmt /usr/local/bin/
      - name: Check shell script formatting
        run: shfmt -d .

  shell-script-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install shellcheck
        run: |
          wget -O shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.9.0/shellcheck-v0.9.0.linux.x86_64.tar.xz
          tar -xf shellcheck.tar.xz
          sudo mv shellcheck-v0.9.0/shellcheck /usr/local/bin/
      - name: Check shell script quality
        run: |
          # -S warning: Only fail on warnings and errors, not info
          # -e SC1091: Ignore missing source warning
          # {} +: Pass multiple files to shellcheck at once for efficiency
          find . -name "*.sh" \
            -not -path "./.git/*" \
            -not -path "./**/node_modules/*" \
            -not -path "./runtimes/java/versions/latest/gradlew" \
            -not -path "./runtimes/kotlin/versions/latest/gradlew" \
            -exec shellcheck -e SC1091 -S warning {} +

  open-runtimes:
    needs: prepare
    name: ${{ matrix.ID }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
      - name: Setup Composer
        run: |
          php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          php composer-setup.php
          php -r "unlink('composer-setup.php');"
          mv composer.phar /usr/local/bin/composer
      - name: Install dependencies
        run: composer install
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Run tests
        timeout-minutes: 15
        working-directory: ./
        run: bun ci/test.ts ${{ matrix.ID }}
      - name: Upload startup metrics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: startup-metrics-${{ matrix.ID }}
          path: /tmp/startup-metrics.json
          if-no-files-found: ignore
      - name: Report image size
        if: always() && matrix.REPORT_SIZE
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { exitCode, stdout } = await exec.getExecOutput('docker', ['image', 'inspect', 'open-runtimes/test-runtime', '--format={{.Size}}'], { silent: true, ignoreReturnCode: true });
            const sizeBytes = exitCode === 0 ? parseInt(stdout.trim()) : 0;
            if (!sizeBytes) return;

            const marker = '<!-- image-size-check ';
            const id = '${{ matrix.ID }}';
            const size = (sizeBytes / 1048576).toFixed(2) + ' MB';
            const pr = context.payload.pull_request.number;

            for (let attempt = 0; attempt < 5; attempt++) {
              if (attempt > 0)
                await new Promise(r => setTimeout(r, Math.floor(Math.random() * 5000) + 2000));

              const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: pr });
              const comment = comments.find(c => c.body?.includes(marker));

              const b64 = comment?.body?.match(/<!-- image-size-check (.+?) -->/)?.[1];
              const state = b64 ? JSON.parse(Buffer.from(b64, 'base64').toString()) : {};
              state[id] = size;

              const encoded = Buffer.from(JSON.stringify(state)).toString('base64');
              let body = `<!-- image-size-check ${encoded} -->\n## Docker Image Sizes\n\n| Runtime | Size |\n|---------|------|\n`;
              for (const [n, s] of Object.entries(state).sort((a, b) => a[0].localeCompare(b[0]))) body += `| \`${n}\` | ${s} |\n`;

              if (comment)
                await github.rest.issues.updateComment({ ...context.repo, comment_id: comment.id, body });
              else
                await github.rest.issues.createComment({ ...context.repo, issue_number: pr, body });

              await new Promise(r => setTimeout(r, 1000));
              const { data: verify } = await github.rest.issues.listComments({ ...context.repo, issue_number: pr });
              if (verify.find(c => c.body?.includes(marker))?.body?.includes(id)) break;
            }

  # Aggregates the per-runtime startup metrics after every matrix job finishes.
  # A single writer avoids the read-modify-write races a per-job comment update
  # would have; the base64 marker carries rows forward across pushes that only
  # re-test a subset of runtimes.
  report-startup-time:
    needs: open-runtimes
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download startup metrics
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: startup-metrics-*
          path: startup-metrics
      - name: Report startup time
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const fresh = {};
            const root = 'startup-metrics';
            for (const dir of fs.existsSync(root) ? fs.readdirSync(root) : []) {
              const file = path.join(root, dir, 'startup-metrics.json');
              if (!fs.existsSync(file)) continue;
              try {
                fresh[dir.replace(/^startup-metrics-/, '')] = JSON.parse(fs.readFileSync(file, 'utf8'));
              } catch (e) {
                console.warn(`Skipping unreadable metrics file ${file}: ${e.message}`);
              }
            }
            if (Object.keys(fresh).length === 0) return;

            const marker = '<!-- startup-time-check ';
            const pr = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: pr, per_page: 100 });
            const comment = comments.find(c => c.body?.includes(marker));

            const b64 = comment?.body?.match(/<!-- startup-time-check (.+?) -->/)?.[1];
            let state = {};
            try { state = b64 ? JSON.parse(Buffer.from(b64, 'base64').toString()) : {}; } catch {}
            Object.assign(state, fresh);

            const fmt = (v) => typeof v === 'number' ? v.toFixed(2) + ' s' : '—';
            const encoded = Buffer.from(JSON.stringify(state)).toString('base64');
            let body = `<!-- startup-time-check ${encoded} -->\n## Server Startup Times\n\nCold start is the wall time from container start until \`/__opr/health\` responds; the breakdown comes from \`/__opr/timings\`.\n\n| Runtime | Cold start | Extract | Prepare | Server boot |\n|---------|-----------|---------|---------|-------------|\n`;
            for (const [n, m] of Object.entries(state).sort((a, b) => a[0].localeCompare(b[0]))) body += `| \`${n}\` | ${fmt(m.cold_start)} | ${fmt(m.extract)} | ${fmt(m.prepare)} | ${fmt(m.startup)} |\n`;

            if (comment)
              await github.rest.issues.updateComment({ ...context.repo, comment_id: comment.id, body });
            else
              await github.rest.issues.createComment({ ...context.repo, issue_number: pr, body });
